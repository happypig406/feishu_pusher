name: 推送飞书

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: 安装依赖
        run: pip install requests feedparser
        
      - name: 运行推送脚本
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python push_feishu.py
